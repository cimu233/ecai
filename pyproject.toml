[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoe-audio-pipeline"
version = "0.2.0"
description = "Local audio, transcription, and structured notes pipeline for authorized Xiaoe courses."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["imageio-ffmpeg>=0.6,<0.7", "websocket-client>=1.8,<2"]

[project.scripts]
xiaoe = "xiaoe_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
