name: Build Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Lite: minimal exe, deps at first run ──
  build-lite:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install build tools
        run: pip install pyinstaller

      - name: Build ecai.exe
        run: |
          pyinstaller `
            --onefile --name ecai `
            --hidden-import xiaoe_core --hidden-import xiaoe_core.config `
            --hidden-import xiaoe_core.browser --hidden-import xiaoe_core.database `
            --hidden-import xiaoe_core.services --hidden-import xiaoe_core.models `
            --hidden-import xiaoe_core.media --hidden-import xiaoe_core.pipeline `
            --hidden-import xiaoe_core.ego_browser --hidden-import xiaoe_core.playwright_browser `
            --hidden-import xiaoe_core.xiaoe --hidden-import xiaoe_core.downloader `
            --hidden-import xiaoe_core.download_service --hidden-import xiaoe_core.transcription_service `
            --hidden-import xiaoe_core.structure_service --hidden-import xiaoe_core.structurer `
            --hidden-import xiaoe_core.asr --hidden-import xiaoe_core.asr_registry `
            --hidden-import xiaoe_core.auth --hidden-import xiaoe_core.secrets `
            --hidden-import xiaoe_core.slider_captcha --hidden-import xiaoe_core.api `
            --hidden-import xiaoe_cli --hidden-import xiaoe_cli.main `
            --hidden-import xiaoe_cli.setup --hidden-import xiaoe_cli.course_picker `
            --collect-all pip `
            src/xiaoe_cli/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          ls dist/

      - name: Package as zip
        run: Compress-Archive -Path "dist\ecai.exe" -DestinationPath "ecai-lite.zip"

      - uses: actions/upload-artifact@v4
        with: { name: ecai-lite, path: ecai-lite.zip }

  # ── Full: everything bundled ──
  build-full:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract ffmpeg
        run: |
          python -c @"
          from imageio_ffmpeg import get_ffmpeg_exe
          import shutil
          shutil.copy(get_ffmpeg_exe(), 'ffmpeg.exe')
          "@

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Build ecai.exe
        run: |
          pyinstaller `
            --onefile --name ecai `
            --add-binary "ffmpeg.exe;." `
            --hidden-import xiaoe_core --hidden-import xiaoe_core.config `
            --hidden-import xiaoe_core.browser --hidden-import xiaoe_core.database `
            --hidden-import xiaoe_core.services --hidden-import xiaoe_core.models `
            --hidden-import xiaoe_core.media --hidden-import xiaoe_core.pipeline `
            --hidden-import xiaoe_core.ego_browser --hidden-import xiaoe_core.playwright_browser `
            --hidden-import xiaoe_core.xiaoe --hidden-import xiaoe_core.downloader `
            --hidden-import xiaoe_core.download_service --hidden-import xiaoe_core.transcription_service `
            --hidden-import xiaoe_core.structure_service --hidden-import xiaoe_core.structurer `
            --hidden-import xiaoe_core.asr --hidden-import xiaoe_core.asr_registry `
            --hidden-import xiaoe_core.auth --hidden-import xiaoe_core.secrets `
            --hidden-import xiaoe_core.slider_captcha --hidden-import xiaoe_core.api `
            --hidden-import xiaoe_cli --hidden-import xiaoe_cli.main `
            --hidden-import xiaoe_cli.setup --hidden-import xiaoe_cli.course_picker `
            --collect-all websocket --collect-all imageio_ffmpeg `
            --collect-all playwright --collect-all cv2 --collect-all numpy --collect-all keyring `
            src/xiaoe_cli/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          ls dist/

      - name: Locate Playwright Chromium
        id: pw
        run: |
          $exe = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          $root = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $exe))
          echo "pw_root=$root" >> $env:GITHUB_OUTPUT

      - name: Bundle everything
        run: |
          mkdir ecai-full -Force
          Copy-Item "dist\ecai.exe" "ecai-full\"
          Remove-Item "ecai-full\playwright-browsers" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "${{ steps.pw.outputs.pw_root }}\*" "ecai-full\playwright-browsers\"
          Compress-Archive -Path "ecai-full\*" -DestinationPath "ecai-full.zip"

      - uses: actions/upload-artifact@v4
        with: { name: ecai-full, path: ecai-full.zip }

  # ── Release upload ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-lite, build-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          ls ecai-lite/ ecai-full/
          cp ecai-lite/ecai-lite.zip .
          cp ecai-full/ecai-full.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ecai-lite.zip
            ecai-full.zip
          generate_release_notes: true
